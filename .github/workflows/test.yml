name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEEPSEEK_API_KEY: ci-placeholder-key
  MYSQL_USER: ci_user
  MYSQL_PASSWORD: ci-placeholder-password
  MYSQL_DATABASE: ci_test_db
  MYSQL_HOST: 127.0.0.1
  REDIS_PASSWORD: ""
  APP_ACCESS_TOKEN: ci-placeholder-access-token
  APP_USER_ID: ci-user

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-placeholder-password
          MYSQL_DATABASE: ci_test_db
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci-placeholder-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-placeholder-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile source files
        run: python -m compileall -q app agents db evaluation memory rag tools

      - name: Verify MySQL migrations reach Alembic head
        run: |
          python -m db.init_db --upgrade
          alembic current

      - name: Run tests
        run: python -m pytest -q

      - name: Run reproducible RAG baseline
        run: python evaluation/run_eval.py --top-k 2 --output "${{ runner.temp }}/rag-eval.json"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Test and build React workspace
        working-directory: web
        run: |
          npm test -- --run
          npm run build
