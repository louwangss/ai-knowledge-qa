name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEEPSEEK_API_KEY: ci-placeholder-key
  MYSQL_USER: ci_user
  MYSQL_PASSWORD: ci-placeholder-password
  MYSQL_DATABASE: ci_test_db
  REDIS_PASSWORD: ""
  APP_ACCESS_TOKEN: ci-placeholder-access-token
  APP_USER_ID: ci-user

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile source files
        run: python -m compileall -q app agents db evaluation frontend memory rag tools

      - name: Run tests
        run: python -m pytest -q

      - name: Run reproducible RAG baseline
        run: python evaluation/run_eval.py --top-k 2 --output "${{ runner.temp }}/rag-eval.json"
